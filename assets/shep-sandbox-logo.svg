<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 33 448 448" width="512" height="512">
  <title>shep-sandbox</title>
  <defs>
    <style>
      .ink { stroke: #3B2620; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
      .sand { fill: #F4D49B; }
      .rope { fill: none; stroke: #D8B47A; stroke-width: 5; stroke-linecap: round; }
      .ring-ink { fill: none; stroke: #3B2620; stroke-width: 15; stroke-linecap: round; }
      .ring { fill: none; stroke: #2D5DA8; stroke-width: 8; stroke-linecap: round; }
    </style>
    <!-- a king crab pot: a cone cut off at the top, like a lampshade -->
    <path id="cone" d="M146 170 L 56 420 A 200 40 0 0 0 456 420 L 366 170 A 110 26 0 0 0 146 170 Z"/>
    <clipPath id="inside"><use href="#cone"/></clipPath>
    <clipPath id="buoy"><rect x="376" y="54" width="58" height="44" rx="22"/></clipPath>
  </defs>

  <!-- bridle up to a knot, and the line out to the buoy -->
  <path class="ink" fill="none" d="M164 166 L 256 92 L 348 166 M 256 92 C 300 92, 330 70, 374 74"/>
  <path class="rope" d="M164 166 L 256 92 L 348 166 M 256 92 C 300 92, 330 70, 374 74"/>
  <circle class="ink" cx="256" cy="92" r="7" fill="#D8B47A"/>
  <g transform="rotate(-20 404 76)">
    <rect x="376" y="54" width="58" height="44" rx="22" fill="#FFFFFF"/>
    <g clip-path="url(#buoy)" fill="#E94F37"><rect x="376" y="54" width="19" height="44"/><rect x="415" y="54" width="19" height="44"/></g>
    <rect class="ink" x="376" y="54" width="58" height="44" rx="22" fill="none"/>
  </g>

  <!-- inside the pot: net, the far side of the rings and struts -->
  <use href="#cone" fill="#DDF3EE"/>
  <g clip-path="url(#inside)">
    <g stroke="#A6DACF" stroke-width="5">
      <path d="M0 150 L 340 490 M 0 90 L 400 490 M 30 60 L 460 490 M 90 60 L 520 490 M 150 60 L 520 430 M 210 60 L 520 370 M 270 60 L 520 310 M 330 60 L 520 250 M 0 210 L 280 490 M 0 270 L 220 490 M 0 330 L 160 490"/>
      <path d="M512 150 L 172 490 M 512 90 L 112 490 M 482 60 L 52 490 M 422 60 L -8 490 M 362 60 L -8 430 M 302 60 L -8 370 M 242 60 L -8 310 M 182 60 L -8 250 M 512 210 L 232 490 M 512 270 L 292 490 M 512 330 L 352 490"/>
    </g>
    <ellipse cx="256" cy="300" rx="157" ry="33" fill="none" stroke="#2D5DA8" stroke-width="7" opacity="0.55"/>
    <path fill="#EBC587" d="M40 380 C 80 356, 140 354, 180 376 C 210 392, 236 384, 268 380 C 310 374, 340 392, 372 380 C 404 366, 440 368, 470 384 L 470 470 L 40 470 Z"/>
  </g>

  <!-- the red funnel that hangs from the top ring -->
  <path class="ink" fill="#E94F37" d="M164 170 L 186 226 A 70 16 0 0 0 326 226 L 348 170 Z"/>
  <ellipse class="ink" cx="256" cy="170" rx="92" ry="20" fill="#B8352A"/>
  <ellipse cx="256" cy="176" rx="70" ry="12" fill="#8E2A22"/>

  <!-- the sheep, from shep's mark (web/public/icon.svg in shep-pm/shep) -->
  <g transform="translate(292 430) scale(2.65) translate(-51 -73)">
    <g fill="#3B2620">
      <rect x="40" y="52" width="8" height="21" rx="4"/>
      <rect x="66" y="52" width="8" height="21" rx="4"/>
    </g>
    <path d="M40 20c6-9 22-10 28-2 10-3 19 4 18 13 7 4 7 15-1 19-2 8-12 11-19 8-8 5-21 4-26-3-10 1-17-7-15-16-4-8 4-18 15-19Z" fill="#FFFDF5" stroke="#3B2620" stroke-width="3" stroke-linejoin="round"/>
    <!-- turned to face out, a little sheepish about where it is -->
    <ellipse cx="13" cy="43" rx="8" ry="4.5" transform="rotate(28 13 43)" fill="#3B2620"/>
    <ellipse cx="43" cy="43" rx="8" ry="4.5" transform="rotate(-28 43 43)" fill="#3B2620"/>
    <ellipse cx="28" cy="49" rx="14" ry="15" fill="#3B2620"/>
    <path d="M19 38a5 5 0 0 1 6-6a5 5 0 0 1 7 0a5 5 0 0 1 6 6Z" fill="#FFFDF5" stroke="#3B2620" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="23" cy="47" r="3.2" fill="#FFFDF5"/>
    <circle cx="33" cy="47" r="3.2" fill="#FFFDF5"/>
    <circle cx="22.2" cy="46" r="1.5" fill="#3B2620"/>
    <circle cx="32.2" cy="46" r="1.5" fill="#3B2620"/>
    <path d="M19.5 42.6L25 41.4M36.5 42.6L31 41.4" stroke="#FFFDF5" stroke-width="1.3" stroke-linecap="round"/>
    <ellipse cx="19.5" cy="54" rx="3.4" ry="2" fill="#FFB0A0" opacity="0.75"/>
    <ellipse cx="36.5" cy="54" rx="3.4" ry="2" fill="#FFB0A0" opacity="0.75"/>
    <path d="M25.5 57q2.5-1.6 5 0" fill="none" stroke="#FFFDF5" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- sand in front, and the sandcastle -->
  <g clip-path="url(#inside)">
    <path class="sand" d="M40 414 C 80 398, 130 396, 172 408 C 204 418, 226 402, 260 400 C 296 398, 318 414, 352 412 C 390 410, 424 392, 470 402 L 470 470 L 40 470 Z"/>
    <g fill="none" stroke="#E3BB72" stroke-width="3" stroke-linecap="round">
      <path d="M196 432 Q 214 426 232 432 M 300 440 Q 320 434 340 440 M 380 426 Q 396 420 412 426"/>
    </g>
    <g fill="#E3BB72">
      <circle cx="150" cy="436" r="3"/><circle cx="236" cy="446" r="3"/><circle cx="300" cy="432" r="3"/>
      <circle cx="352" cy="444" r="3"/><circle cx="96" cy="430" r="3"/><circle cx="410" cy="428" r="3"/>
    </g>
  </g>
  <!-- a tuft of grass and a daisy, where crabpot has its sandcastle -->
  <g>
    <path class="ink" style="stroke-width:5" fill="#9BD889" d="M96 428 C 92 410, 88 396, 80 386 C 94 394, 102 410, 106 428 Z"/>
    <path class="ink" style="stroke-width:5" fill="#9BD889" d="M124 428 C 128 410, 134 400, 146 394 C 138 406, 132 416, 132 428 Z"/>
    <path class="ink" fill="none" style="stroke-width:8" d="M117 428 Q 118 400 124 376"/>
    <path fill="none" stroke="#7CC36B" stroke-width="3" stroke-linecap="round" d="M117 428 Q 118 400 124 376"/>
    <path class="ink" style="stroke-width:5" fill="#AEE29B" d="M104 428 C 102 406, 104 390, 110 378 C 114 394, 116 410, 116 428 Z"/>
    <g transform="translate(124 370) scale(1.25) translate(-124 -370)">
    <g class="ink" style="stroke-width:3.5" fill="#FFFDF5">
      <circle cx="124" cy="358" r="6.5"/><circle cx="138" cy="366" r="6.5"/><circle cx="134" cy="381" r="6.5"/>
      <circle cx="117" cy="383" r="6.5"/><circle cx="110" cy="368" r="6.5"/>
    </g>
    <g fill="#FFFDF5">
      <circle cx="124" cy="358" r="6.5"/><circle cx="138" cy="366" r="6.5"/><circle cx="134" cy="381" r="6.5"/>
      <circle cx="117" cy="383" r="6.5"/><circle cx="110" cy="368" r="6.5"/>
    </g>
    <circle class="ink" style="stroke-width:3" cx="124" cy="370" r="6" fill="#F2C14E"/>
    </g>
  </g>

  <!-- front struts, in front of the sheep -->
  <path class="ring-ink" style="stroke-width:13" d="M201 192 L 156 455 M 311 192 L 356 455"/>
  <path class="ring" style="stroke-width:6" d="M201 192 L 156 455 M 311 192 L 356 455"/>
  <!-- the middle ring's near half, in front of the sheep (its far half is drawn faint behind it) -->
  <path class="ring-ink" style="stroke-width:13" d="M99 300 A 157 33 0 0 0 413 300"/>
  <path class="ring" style="stroke-width:6" d="M99 300 A 157 33 0 0 0 413 300"/>
  <!-- the frame: side struts, bottom ring's near half, top ring -->
  <path class="ring-ink" d="M146 170 L 56 420 M 366 170 L 456 420"/>
  <path class="ring" d="M146 170 L 56 420 M 366 170 L 456 420"/>
  <path class="ring-ink" d="M56 420 A 200 40 0 0 0 456 420"/>
  <path class="ring" d="M56 420 A 200 40 0 0 0 456 420"/>
  <ellipse class="ring-ink" cx="256" cy="170" rx="110" ry="26"/>
  <ellipse class="ring" cx="256" cy="170" rx="110" ry="26"/>

  <!-- rope lashed round the top ring -->
  <g class="ink" fill="none" stroke-width="4">
    <path d="M158 182 L 166 192 M 168 180 L 176 190 M 344 180 L 336 190 M 354 182 L 346 192"/>
  </g>
  <g class="rope" stroke-width="3">
    <path d="M158 182 L 166 192 M 168 180 L 176 190 M 344 180 L 336 190 M 354 182 L 346 192"/>
  </g>
</svg>
