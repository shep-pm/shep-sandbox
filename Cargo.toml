[package]
name = "shep-sandbox"
version = "0.1.0"
edition = "2024"
# shep's MSRV. A dog or client that needs a newer compiler than the shepherd
# it works with is a bad example.
rust-version = "1.88"
description = "Run a shep sheep inside a crabpot sandbox"
repository = "https://github.com/shep-pm/shep-sandbox"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["shep"]
# docs/ holds planning and design notes. They belong in the repository, not in
# a published .crate, which is permanent.
exclude = ["/docs/"]

[features]
# Option: builds the tests that drive a real shepherd. Off by default because
# they need a `shep` binary at `$SHEP_BIN`, which a fresh clone lacks.
integration = []

[dependencies]
# 0.10.5 is the first release with the `schema` feature, which publishes the
# `Config` schema the dog serves for a sheep's table. 0.10.7 is the first with
# `--control-fd`, which swaps the network lists of a running sandbox. Without
# `cli`, the dependency is the library alone.
crabpot = { version = "0.10.7", default-features = false, features = ["schema"] }
# 0.17.0 is the first release whose `Probe` answers the manifest flag and
# carries a `Verb`, which `shep sandbox` needs. 0.22.0 is the first release
# whose `Probe` declares `launch`. 0.23.0 is the shep this dog is tested
# against, the first that refuses the old `sandbox` key.
# `schema` answers `--schema`.
shep-client = { version = "0.23.0", default-features = false, features = ["schema"] }
# The version shep-client pins. `client` is what `serve` and `on_action` need.
shep-channel = { version = "0.23.0", default-features = false, features = ["client"] }
# `#[derive(JsonSchema)]` expands to absolute `schemars::` paths, so the crate
# has to be nameable here even though shep-client already carries it.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1", default-features = false, features = ["derive"] }
# Builds the settings document handed to crabpot.
serde_json = { version = "1", default-features = false, features = ["std"] }
# `time` is the wait between reconnects of the follower.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
# An unlinked file for the settings crabpot reads through `/dev/fd`.
tempfile = { version = "3", default-features = false }

[dev-dependencies]
# Only to pause the clock in the follower's tests, so a reconnect wait costs
# no time.
tokio = { version = "1", default-features = false, features = ["test-util"] }

[[test]]
name = "integration"
required-features = ["integration"]

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Debug info dominates a debug build, and a dependency's is never what is
# being debugged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Size, not speed: shep measured thin LTO with one codegen unit at a quarter
# off its binary and nothing off its runtime. Not `strip` (a profiler names
# frames by symbol) and not `panic = "abort"` (shep-client re-raises a
# panicked task with `resume_unwind`).
[profile.release]
lto = "thin"
codegen-units = 1
