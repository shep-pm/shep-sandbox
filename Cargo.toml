[package]
name = "shep-sandbox"
version = "0.1.0"
edition = "2024"
# shep's MSRV. A dog or client that needs a newer compiler than the shepherd
# it works with is a bad example.
rust-version = "1.88"
description = "Run a shep sheep inside a crabpot sandbox"
repository = "https://github.com/shep-pm/shep-sandbox"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["shep"]
# docs/ holds planning and design notes. They belong in the repository, not in
# a published .crate, which is permanent.
exclude = ["/docs/"]

[features]
# Option: builds the tests that drive a real shepherd. Off by default because
# they need a `shep` binary at `$SHEP_BIN`, which a fresh clone lacks.
integration = []

[dependencies]
# 0.17.0 is the first release whose `Probe` answers the manifest flag and
# carries a `Verb`, which `shep sandbox` needs. 0.21.0 is the shep this dog
# is tested against. `schema` answers `--schema`.
shep-client = { version = "0.21.0", default-features = false, features = ["schema"] }
# `#[derive(JsonSchema)]` expands to absolute `schemars::` paths, so the crate
# has to be nameable here even though shep-client already carries it.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1", default-features = false, features = ["derive"] }
# Escapes the strings init writes into the settings file.
serde_json = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[dev-dependencies]
# Only to give each integration test its own $SHEP_HOME.
tempfile = { version = "3", default-features = false }

[[test]]
name = "integration"
required-features = ["integration"]

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Debug info dominates a debug build, and a dependency's is never what is
# being debugged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Size, not speed: shep measured thin LTO with one codegen unit at a quarter
# off its binary and nothing off its runtime. Not `strip` (a profiler names
# frames by symbol) and not `panic = "abort"` (shep-client re-raises a
# panicked task with `resume_unwind`).
[profile.release]
lto = "thin"
codegen-units = 1
