# Enables auto-merge on Dependabot's crabpot bump and nothing else. Auto-merge
# only queues the merge: it waits for the required checks of the `main` ruleset.
name: dependabot-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  crabpot:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/cargo/crabpot-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        env:
          # The PAT, not GITHUB_TOKEN: a merge made with GITHUB_TOKEN starts no
          # workflows, so release-plz would never see the bump land on main.
          # Dependabot's pull requests read Dependabot secrets, not Actions
          # secrets: set `gh secret set RELEASE_PLZ_TOKEN --app dependabot`.
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
