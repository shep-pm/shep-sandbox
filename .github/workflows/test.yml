name: test
# One job per gate. Every job carries `timeout-minutes`, a ceiling against a
# hang rather than a performance budget: GitHub's default is 360.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo doc --no-deps --all-features --locked
    env:
      RUSTDOCFLAGS: -D warnings

  test:
    # Both platforms shep ships on, which disagree about filesystems and
    # signals more often than seems likely.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Matches `rust-version` in Cargo.toml.
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --all-targets --all-features --locked

  integration:
    # Drives a real shepherd, which no other job here does. Feature-gated off
    # by default because a fresh clone has no `shep` binary.
    #
    # Built from shep's `main` rather than the version the lockfile pins, so
    # a red job means shep's surface moved under this dog.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      # The bare `shep` is the package spec: the workspace holds more than
      # one package with a binary, and `--bin` does not pick between them.
      - name: Build a real shep
        run: cargo install --git https://github.com/shep-pm/shep --branch main shep --bin shep --locked
      # doctor's shepherd channel probe runs a real crabpot, which needs
      # bubblewrap and, on Ubuntu 24.04+, unprivileged user namespaces.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu's `bwrap-userns-restrict` profile confines what bwrap starts
      # and strips its capabilities, so crabpot's helper cannot unshare even
      # with the sysctl off. The profile is where the doctor's fix says to
      # unload it from.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          profile=/etc/apparmor.d/bwrap-userns-restrict
          if [ -e "$profile" ]; then sudo apparmor_parser -R "$profile"; fi
          if sudo grep -s '^bwrap' /sys/kernel/security/apparmor/profiles; then
            echo "::error::a bwrap AppArmor profile is still loaded"
            exit 1
          fi
      - name: Install crabpot
        run: cargo install crabpot --locked
      - name: Run the integration tier against it
        run: SHEP_BIN="$(command -v shep)" cargo test --features integration --locked
