# Subjects carry `ci(deps):` and `fix(deps):` so commits.yml accepts them.
# release-plz skips `ci` and `chore` but maps `fix` to Fixed, so a `fix(deps):`
# bump opens a release.
#
# crabpot is the one dependency that releases the dog: once the dog links the
# crabpot crate, a crabpot release changes what the dog does. Until #31 adds
# that dependency there is nothing to bump. Dependabot refuses two `cargo`
# entries for the same directory, so one daily entry covers every crate:
# crabpot is excluded from the group and gets its own pull request on
# `dependabot/cargo/crabpot-*`, the branch dependabot-auto-merge.yml matches.
# Every other crate stays in one grouped pull request, which auto-merge never
# sees.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      cargo:
        patterns: ["*"]
        exclude-patterns: [crabpot]
    commit-message:
      prefix: fix
      include: scope
    labels: [dependencies]
