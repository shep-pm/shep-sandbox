# Subjects carry `ci(deps):` and `chore(deps):` so commits.yml accepts them.
# release-plz skips both types, so a bump alone makes no changelog entry and
# the release workflow's empty-changelog guard holds that release open.
#
# crabpot is the one dependency that releases the dog: the dog links it, so
# a crabpot release changes what the dog does. Its own daily entry carries
# `fix(deps):`, which release-plz maps to Fixed, so a bump opens a release.
# dependabot-auto-merge.yml enables auto-merge on that entry's pull requests
# alone. The monthly entry ignores crabpot so the two never open the same
# pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      - dependency-name: crabpot
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]

  # No group: an ungrouped pull request is on `dependabot/cargo/crabpot-*`,
  # the branch the auto-merge workflow matches.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: crabpot
    commit-message:
      prefix: fix
      include: scope
    labels: [dependencies]
